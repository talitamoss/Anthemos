name: Build & Deploy APK

on:
  push:
    branches: [smart-anthemos]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK with timestamp
        id: rename
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          SHORT_SHA=${GITHUB_SHA::7}
          APK_NAME="anthemos-${TIMESTAMP}-${SHORT_SHA}.apk"
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/${APK_NAME}
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_path=app/build/outputs/apk/debug/${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ANTHEMOS_DEPLOY_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H anthemos.org >> ~/.ssh/known_hosts

      - name: Deploy APK to server
        run: |
          scp ${{ steps.rename.outputs.apk_path }} deploy@anthemos.org:/var/www/anthemos/builds/
          ssh deploy@anthemos.org "cd /var/www/anthemos/builds && ln -sf ${{ steps.rename.outputs.apk_name }} anthemos-latest.apk"
